name: Experimental integration checks
on:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'vite.config.js'
      - 'package*.json'
      - '.github/workflows/integration-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PLAYWRIGHT_BROWSERS_PATH: .test-artifacts/browser-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build to isolated artifact directory
        run: npm run build -- --outDir ../.test-artifacts/ci-build
      - name: Check packaged extension contents
        run: |
          node --check .test-artifacts/ci-build/service_worker.js
          node --check .test-artifacts/ci-build/automation/teams_preflight.js
          node --check .test-artifacts/ci-build/automation/telegram_alerts.js
          node --check .test-artifacts/ci-build/automation/recording_watchdog.js
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('.test-artifacts/ci-build/manifest.json'));if(!m.permissions.includes('tabCapture')||!m.host_permissions.includes('https://api.telegram.org/*'))process.exit(1)"
      - name: Install isolated Chromium for browser fixtures
        run: npx playwright install --with-deps chromium
      - name: Teams join DOM regressions
        run: node scripts/teams-join-dom-validation.mjs
      - name: Preflight browser UI fixture
        run: node scripts/teams-preflight-ui-validation.mjs
      - name: Recorder browser fixture
        env:
          RECORDER_TEST_DIST: .test-artifacts/ci-build
        run: node scripts/browser-validation.mjs
      - name: Sequential Teams browser fixtures
        env:
          RECORDER_TEST_DIST: .test-artifacts/ci-build
        run: node scripts/sequential-schedules-browser-validation.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: screen-recorder-experimental-dist
          path: .test-artifacts/ci-build
          retention-days: 7
