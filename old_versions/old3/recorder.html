<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="recorder.css" />
    <title>Screen Recorder</title>
  </head>
  <body>
    <div class="shell">
      <header class="header">
        <div class="brand">
          <div class="badge">⏺</div>
          <div>
            <div class="h1">Screen Recorder</div>
          </div>
        </div>

        <div class="right">
          <div class="pill" id="statusPill">Idle</div>
          <div class="timer" id="timer">00:00</div>
        </div>
      </header>

      <main class="grid">
        <!-- Left: Controls -->
        <section class="panel">
          <div class="actions">
            <button class="btn primary" id="startBtn">🎬 Start Recording</button>
            <button class="btn danger inactive" id="stopBtn" disabled>Stop</button>
          </div>

          <div class="divider"></div>

          <div class="smallRow">
            <div class="smallLabel">Format</div>
            <div class="smallValue" id="formatLabel">—</div>
          </div>

          <div class="smallRow">
            <div class="smallLabel">Last file</div>
            <div class="smallValue" id="meta">—</div>
          </div>
        </section>

        <!-- Right: Video area (preview <-> playback) -->
        <section class="panel videoPanel">
          <div class="previewTop">
            <h3 id="videoTitle">Live Preview</h3>
            <div class="metaRight" id="metaRight"></div>
          </div>

          <div class="videoWrap">
            <!-- Live Preview (shown while recording / before first stop) -->
            <video id="preview" autoplay muted playsinline></video>

            <!-- Playback (shown after stop) -->
            <div id="playbackPane" class="playbackPane hidden">
              <video id="playbackVideo" controls playsinline></video>
              <button id="downloadBtn" class="playback-button">⬇️ Download</button>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="recorder.js"></script>
  </body>
</html>
