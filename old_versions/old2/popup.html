<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 300px;
      padding: 15px;
      font-family: system-ui, sans-serif;
      background: #f9f9f9;
    }
    .container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    h2 {
      margin: 0 0 5px 0;
      color: #333;
      font-size: 18px;
    }
    .status {
      padding: 10px;
      border-radius: 6px;
      background: #e9e9e9;
      font-size: 14px;
    }
    .status.recording {
      background: #ffe6e6;
      color: #b30000;
    }
    button {
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }
    #startBtn {
      background: #4285f4;
      color: white;
    }
    #startBtn:hover {
      background: #3367d6;
    }
    #stopBtn {
      background: #db4437;
      color: white;
    }
    #stopBtn:hover {
      background: #b33224;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .log {
      margin-top: 10px;
      padding: 8px;
      background: #222;
      color: #0f0;
      font-family: monospace;
      font-size: 12px;
      max-height: 150px;
      overflow-y: auto;
      border-radius: 4px;
    }
    .log p {
      margin: 2px 0;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>📹 Screen Recorder</h2>

    <div id="status" class="status">⚪ Idle</div>

    <button id="startBtn">Start Recording</button>
    <button id="stopBtn" disabled>Stop Recording</button>

    <div id="debug" class="log">
      <p>▶ Debug log</p>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
